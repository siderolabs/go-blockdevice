kind: common.Repository
spec:
  mainBranch: v2
---
kind: common.Docker
name: setup-ci
spec:
    allowInsecure: true

---
kind: golang.Toolchain
spec:
    extraPackages:
        - btrfs-progs
        - cdrkit
        - cryptsetup
        - dosfstools
        - e2fsprogs
        - gptfdisk
        - lvm2
        - parted
        - util-linux
        - squashfs-tools
        - xfsprogs
        - mtools
---
kind: service.CodeCov
spec:
  targetThreshold: 35
---
kind: auto.CustomSteps
spec:
  steps:
    - name: zfs-img
      toplevel: true
    - name: md-img
      toplevel: true
---
kind: custom.Step
name: zfs-img
spec:
  makefile:
    enabled: true
  docker:
    enabled: true
    stages:
      - name: zfs-img-gen
        description: Creates the ZFS image
        from: fedora:39
        steps:
          - script:
              command: dnf install -y zfs-fuse zstd && rm -rf /var/cache/dnf
          - script:
              command: |
                --security=insecure zfs-fuse & \
                dd if=/dev/zero of=/tmp/zfs.img bs=16M count=4 iflag=fullblock && \
                sleep 1 && \
                zpool create -f -R /tmp/zfs zroot1 /tmp/zfs.img && \
                zstd -19 /tmp/zfs.img -o /tmp/zfs.img.zst
      - name: zfs-img
        description: copies out the ZFS image
        steps:
          - copy:
              from: zfs-img-gen
              src: /tmp/zfs.img.zst
              dst: /
---
kind: custom.Step
name: md-img
spec:
  makefile:
    enabled: true
  docker:
    enabled: true
    stages:
      - name: md-img-gen
        description: Creates the md (Linux Software RAID) member images
        from: fedora:39
        steps:
          - script:
              command: dnf install -y mdadm util-linux zstd && rm -rf /var/cache/dnf
          - script:
              command: |
                --security=insecure for v in 1.0 1.1 1.2; do \
                  img="/tmp/md-$v.img" && \
                  name="mdset$(echo $v | tr -d .)" && \
                  truncate -s 100M "$img" && \
                  loop=$(losetup --find --show "$img") && \
                  { mdadm --create /dev/md0 --run --force --level=linear --raid-devices=1 --metadata="$v" --name="$name" --homehost=talos "$loop" || true; } && \
                  mdadm --examine "$loop" && \
                  { mdadm --stop /dev/md0 2>/dev/null || true; } && \
                  losetup -d "$loop" && \
                  zstd -19 -f -o "/tmp/md-metadata-$v.img.zst" "$img" || \
                  exit 1; \
                done
      - name: md-img
        description: copies out the md images
        steps:
          - copy:
              from: md-img-gen
              src: /tmp/md-metadata-*.img.zst
              dst: /
---
kind: golang.UnitTests
name: unit-tests
spec:
    requiresInsecure: true
    docker:
      steps:
        - copy:
            from: zfs-img
            src: /
            dst: /src/blkid/testdata/
        - copy:
            from: md-img
            src: /
            dst: /src/blkid/testdata/
---
kind: golang.Generate
spec:
  goGenerateSpecs:
    - source: .
      copy:
        - blkid/
        - internal/
